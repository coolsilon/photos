[project]
name = "photos"
version = "0.2.1"
description = ""
authors = [{ name = "Jeffrey04", email = "mycyberpet@yahoo.com" }]
requires-python = "~=3.12"
readme = "README.md"
dependencies = [
    "typer>=0.12.5,<0.13",
    "structlog>=24.4.0,<25",
    "fastapi[standard]>=0.115.0,<0.116",
    "thumbnail~=1.5",
    "python-dotenv>=1.0.1,<2",
    "pillow>=10.4.0,<11",
    "pillow-heif>=0.18.0,<0.19",
    "ffmpeg-python>=0.2.0,<0.3",
    "passlib[argon2]>=1.7.4,<2",
    "pyjwt>=2.10.1,<3",
]

[tool.hatch.build.targets.sdist]
include = ["src/photos"]

[tool.hatch.build.targets.wheel]
include = ["src/photos"]

[tool.hatch.build.targets.wheel.sources]
"src/photos" = "photos"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
